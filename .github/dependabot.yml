# Dependabot keeps our (deliberately small) dependency tree and CI actions patched.
# https://docs.github.com/code-security/dependabot
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - security
    commit-message:
      prefix: "deps"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - ci
      - security
    commit-message:
      prefix: "ci"

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    # Code scanning uploads require a public repository or GitHub Advanced Security.
    # On a private repo without GHAS the SARIF upload is rejected ("Resource not
    # accessible by integration"), so only run where it can actually succeed. This
    # auto-enables once the repo is public / GHAS is on. Dependabot PRs also get a
    # read-only token and cannot upload, so skip those too.
    if: ${{ github.event.repository.visibility == 'public' && github.actor != 'dependabot[bot]' }}
    strategy:
      fail-fast: false
      matrix:
        # 'rust' is GitHub's CodeQL language id for Rust analysis.
        # Add 'cpp' here once the Fcitx5 C++ FFI adapter lands (Phase 3).
        language: [rust]
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          language: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

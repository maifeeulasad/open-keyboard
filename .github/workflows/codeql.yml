name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    # Dependabot PRs run with a read-only token and cannot upload code-scanning
    # results, which makes this job fail spuriously. Skip it for those PRs; CodeQL
    # still runs on push to main, the weekly schedule, and human PRs.
    if: ${{ github.actor != 'dependabot[bot]' }}
    strategy:
      fail-fast: false
      matrix:
        # 'rust' is GitHub's CodeQL language id for Rust analysis.
        # Add 'cpp' here once the Fcitx5 C++ FFI adapter lands (Phase 3).
        language: [rust]
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          language: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

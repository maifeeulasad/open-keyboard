name: Security audit

on:
  push:
    branches: [main]
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "deny.toml"
      - ".github/workflows/security-audit.yml"
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * *" # daily, so new advisories are caught even without commits

permissions:
  contents: read

jobs:
  cargo-deny:
    name: cargo-deny (advisories, licenses, sources, bans)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

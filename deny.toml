# Configuration for `cargo deny` — supply-chain and license enforcement.
# Run locally with:  cargo deny check
# Also run in CI (see .github/workflows/security-audit.yml).

[advisories]
# Fail on any security advisory affecting our dependency tree.
version = 2
yanked = "deny"

[bans]
# We keep the dependency tree tiny by policy (ADR-0005). These limits are guard
# rails that make an accidental heavy dependency fail CI loudly.
multiple-versions = "warn"
wildcards = "deny"
# Workspace-internal crates are referenced by `{ path = ... }` (no version), which
# cargo-deny would otherwise flag as wildcards. Allow that for path deps only.
allow-wildcard-paths = true

[licenses]
version = 2
# The project is GPL-3.0-only. Only permissive licences that are compatible with
# distributing a GPLv3 binary are allowed for dependencies.
allow = [
    "GPL-3.0-only",
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
    "ISC",
    "Zlib",
]
confidence-threshold = 0.9

[sources]
# Only crates.io is trusted as a registry.
unknown-registry = "deny"
unknown-git = "deny"
